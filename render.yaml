services:
  - type: web
    name: generatalk-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SCRAPE_ENABLED
        value: "false"